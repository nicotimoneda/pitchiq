# Equipos publicados en la web de PitchIQ.
#
# Cada bloque es una competición/temporada de StatsBomb Open Data (ids en
# `statsbombpy.sb.competitions()`). Se publican los equipos de `equipos` (una lista
# o `todos`) o, con `top: N`, los N primeros de la clasificación calculada con los resultados
# (3 puntos por victoria; desempate por diferencia de goles y goles a favor).
# `desempate: directo` aplica el enfrentamiento directo antes que la diferencia de goles.
# `top` solo tiene sentido en temporadas completas: las parciales (p. ej. la
# Bundesliga 2023/24, que solo trae los partidos del Leverkusen) usan `equipos`.
# `nombre` (opcional) sustituye el nombre de la competición en la web.
#
# Regenerar tras cambiar este archivo (sin API key):
#   uv run python scripts/precompute.py --demo-data

competiciones:
  - competition_id: 9     # 1. Bundesliga 2023/24 (con datos de posiciones 360)
    season_id: 281
    equipos: ["Bayer Leverkusen"]

  - competition_id: 11    # La Liga 2020/21: solo los partidos del Barcelona, con 360
    season_id: 90
    equipos: ["Barcelona"]

  - competition_id: 7     # Ligue 1 2022/23: solo los partidos del PSG, con 360
    season_id: 235
    equipos: ["Paris Saint-Germain"]

  - competition_id: 11    # La Liga 2015/16 (temporada completa, sin 360)
    season_id: 27
    equipos: todos
    desempate: directo    # en La Liga los empates a puntos se deciden por el enfrentamiento directo

  - competition_id: 2     # Premier League 2015/16 (temporada completa, sin 360)
    season_id: 27
    equipos: todos

  - competition_id: 55    # Eurocopa 2024 (todos los partidos con 360): semifinalistas
    season_id: 282
    nombre: Eurocopa
    equipos: ["Spain", "England", "France", "Netherlands"]

  - competition_id: 43    # Mundial 2022 (todos los partidos con 360): semifinalistas
    season_id: 106
    nombre: Mundial
    equipos: ["Argentina", "France", "Croatia", "Morocco"]

  - competition_id: 53    # Eurocopa femenina 2025 (todos los partidos con 360): semifinalistas
    season_id: 315
    nombre: Eurocopa femenina
    equipos: ["England Women's", "Spain Women's", "Germany Women's", "Italy Women's"]

# Nombres en español para la web (equipos publicados y rivales). StatsBomb los
# da en inglés; los que no aparecen aquí se muestran tal cual. En selecciones
# femeninas se traduce el nombre sin el sufijo " Women's".
